name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n scripts/install-jishushell.sh
      - run: bash scripts/install-jishushell.sh --help
      - run: python -m unittest discover -s tests -v
      - run: python scripts/configure-openclaw.py --help
      - run: python scripts/verify-openclaw.py --help
